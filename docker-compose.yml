version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: edtech_db
    environment:
      POSTGRES_USER: edtech_user
      POSTGRES_PASSWORD: edtech_password
      POSTGRES_DB: edtech_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: edtech_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: edtech_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: edtech_backend
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - minio
    restart: unless-stopped

  celery:
    build:
      context: ./backend
    container_name: edtech_celery
    command: celery -A config worker -l info
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: edtech_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
